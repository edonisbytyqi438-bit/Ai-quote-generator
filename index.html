<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProQuote Construction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef1f4;
      color: #1f2937;
    }

    .container {
      max-width: 720px;
      margin: 20px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      font-size: 48px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #6b7280;
      margin-top: 8px;
    }

    .section-title {
      margin-top: 28px;
      padding-bottom: 8px;
      border-bottom: 2px solid #222;
      font-size: 18px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #222;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .new-button {
      background: #777;
    }

    #quote {
      display: none;
      margin-top: 35px;
      padding: 28px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: white;
    }

    .quote-header {
      text-align: center;
      border-bottom: 2px solid #222;
      padding-bottom: 18px;
      margin-bottom: 22px;
    }

    .quote-contact {
      color: #555;
    }

    .quote-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 11px 0;
      border-bottom: 1px solid #eee;
    }

    .total {
      font-size: 26px;
      font-weight: bold;
      margin-top: 24px;
      text-align: right;
    }

    .print-button {
      background: #555;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        max-width: 100%;
      }

      .form-section,
      .main-button,
      .new-button,
      .print-button {
        display: none;
      }

      #quote {
        display: block !important;
        border: none;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="form-section">

    <div class="brand">
      <div class="brand-logo">🏗️</div>

      <h1>ProQuote Construction</h1>

      <p class="subtitle">
        Professional construction estimates in seconds.
      </p>
    </div>

    <div class="section-title">
      Company Information
    </div>

    <label>Company Name</label>
    <input id="company" type="text" placeholder="ABC Construction">

    <label>Phone Number</label>
    <input id="phone" type="tel" placeholder="+383 44 123 456">

    <label>Email</label>
    <input id="email" type="email" placeholder="company@email.com">

    <div class="section-title">
      Project Information
    </div>

    <label>Client Name</label>
    <input id="client" type="text" placeholder="John Smith">

    <label>Project Name</label>
    <input id="project" type="text" placeholder="House Renovation">

    <label>Project Type</label>
    <select id="type">
      <option>New Construction</option>
      <option>House Renovation</option>
      <option>Roofing</option>
      <option>Concrete Work</option>
      <option>Painting</option>
      <option>Other</option>
    </select>

    <label>Area (m²)</label>
    <input id="area" type="number" min="0" placeholder="120">

    <label>Price per m² (€)</label>
    <input id="price" type="number" min="0" placeholder="50">

    <div class="section-title">
      Costs
    </div>

    <label>Materials (€)</label>
    <input id="materials" type="number" min="0" placeholder="2000">

    <label>Labor (€)</label>
    <input id="labor" type="number" min="0" placeholder="1500">

    <label>Other Costs (€)</label>
    <input id="other" type="number" min="0" placeholder="500">

    <button class="main-button" onclick="generateQuote()">
      Generate Construction Quote
    </button>

  </div>

  <div id="quote"></div>

</div>

<script>

function generateQuote() {

  const company = document.getElementById("company").value.trim() || "Construction Company";
  const phone = document.getElementById("phone").value.trim() || "Not provided";
  const email = document.getElementById("email").value.trim() || "Not provided";
  const client = document.getElementById("client").value.trim() || "Client";
  const project = document.getElementById("project").value.trim() || "Construction Project";
  const type = document.getElementById("type").value;

  const area = Number(document.getElementById("area").value) || 0;
  const price = Number(document.getElementById("price").value) || 0;
  const materials = Number(document.getElementById("materials").value) || 0;
  const labor = Number(document.getElementById("labor").value) || 0;
  const other = Number(document.getElementById("other").value) || 0;

  const areaCost = area * price;
  const total = areaCost + materials + labor + other;

  const quoteNumber =
    "Q-" + Math.floor(10000 + Math.random() * 90000);

  const date = new Date().toLocaleDateString();

  const quote = document.getElementById("quote");

  quote.style.display = "block";

  quote.innerHTML = `

    <div class="quote-header">

      <div style="font-size:38px;">🏗️</div>

      <h2>PROQUOTE CONSTRUCTION</h2>

      <p><strong>${company}</strong></p>

      <div class="quote-contact">
        <p>📞 ${phone}</p>
        <p>✉️ ${email}</p>
      </div>

      <p><strong>Quote #:</strong> ${quoteNumber}</p>

      <p><strong>Date:</strong> ${date}</p>

    </div>

    <p><strong>Client:</strong> ${client}</p>

    <p><strong>Project:</strong> ${project}</p>

    <p><strong>Type:</strong> ${type}</p>

    <p><strong>Area:</strong> ${area} m²</p>

    <h3>Cost Breakdown</h3>

    <div class="quote-row">
      <span>Construction</span>
      <span>€${areaCost.toFixed(2)}</span>
    </div>

    <div class="quote-row">
      <span>Materials</span>
      <span>€${materials.toFixed(2)}</span>
    </div>

    <div class="quote-row">
      <span>Labor</span>
      <span>€${labor.toFixed(2)}</span>
    </div>

    <div class="quote-row">
      <span>Other Costs</span>
      <span>€${other.toFixed(2)}</span>
    </div>

    <div class="total">
      TOTAL: €${total.toFixed(2)}
    </div>

    <button
      class="print-button"
      onclick="window.print()">
      Print / Save as PDF
    </button>

    <button
      class="new-button"
      onclick="newQuote()">
      + New Quote
    </button>

  `;

  quote.scrollIntoView({
    behavior: "smooth"
  });
}

function newQuote() {

  document.getElementById("company").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("email").value = "";
  document.getElementById("client").value = "";
  document.getElementById("project").value = "";
  document.getElementById("area").value = "";
  document.getElementById("price").value = "";
  document.getElementById("materials").value = "";
  document.getElementById("labor").value = "";
  document.getElementById("other").value = "";

  document.getElementById("type").selectedIndex = 0;

  const quote = document.getElementById("quote");

  quote.style.display = "none";
  quote.innerHTML = "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

</script>

</body>
</html>
