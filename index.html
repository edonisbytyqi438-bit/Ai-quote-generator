<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Construction Quote Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f3f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #quote {
      display: none;
      margin-top: 30px;
      padding: 25px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .quote-header {
      text-align: center;
      border-bottom: 2px solid #222;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .quote-contact {
      text-align: center;
      color: #555;
      margin-top: 10px;
    }

    .quote-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .total {
      font-size: 25px;
      font-weight: bold;
      margin-top: 20px;
      text-align: right;
    }

    .print-button {
      background: #555;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        max-width: 100%;
      }

      .form-section,
      .main-button,
      .print-button {
        display: none;
      }

      #quote {
        display: block !important;
        border: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="form-section">

      <h1>🏗️ Construction Quote Generator</h1>

      <p class="subtitle">
        Create a professional construction estimate.
      </p>

      <label>Company Name</label>
      <input
        id="company"
        type="text"
        placeholder="e.g. ABC Construction"
      >

      <label>Phone Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="e.g. +383 44 123 456"
      >

      <label>Email</label>
      <input
        id="email"
        type="email"
        placeholder="e.g. company@email.com"
      >

      <label>Client Name</label>
      <input
        id="client"
        type="text"
        placeholder="e.g. John Smith"
      >

      <label>Project Name</label>
      <input
        id="project"
        type="text"
        placeholder="e.g. House Renovation"
      >

      <label>Project Type</label>
      <select id="type">
        <option>New Construction</option>
        <option>House Renovation</option>
        <option>Roofing</option>
        <option>Concrete Work</option>
        <option>Painting</option>
        <option>Other</option>
      </select>

      <label>Area (m²)</label>
      <input
        id="area"
        type="number"
        min="0"
        placeholder="e.g. 120"
      >

      <label>Price per m² (€)</label>
      <input
        id="price"
        type="number"
        min="0"
        placeholder="e.g. 50"
      >

      <label>Materials (€)</label>
      <input
        id="materials"
        type="number"
        min="0"
        placeholder="e.g. 2000"
      >

      <label>Labor (€)</label>
      <input
        id="labor"
        type="number"
        min="0"
        placeholder="e.g. 1500"
      >

      <label>Other Costs (€)</label>
      <input
        id="other"
        type="number"
        min="0"
        placeholder="e.g. 500"
      >

      <button class="main-button" onclick="generateQuote()">
        Generate Construction Quote
      </button>

    </div>

    <div id="quote"></div>

  </div>

  <script>

    function generateQuote() {

      const company =
        document.getElementById("company").value.trim() ||
        "Construction Company";

      const phone =
        document.getElementById("phone").value.trim() ||
        "Not provided";

      const email =
        document.getElementById("email").value.trim() ||
        "Not provided";

      const client =
        document.getElementById("client").value.trim() ||
        "Client";

      const project =
        document.getElementById("project").value.trim() ||
        "Construction Project";

      const type =
        document.getElementById("type").value;

      const area =
        Number(document.getElementById("area").value) || 0;

      const price =
        Number(document.getElementById("price").value) || 0;

      const materials =
        Number(document.getElementById("materials").value) || 0;

      const labor =
        Number(document.getElementById("labor").value) || 0;

      const other =
        Number(document.getElementById("other").value) || 0;

      const areaCost = area * price;

      const total =
        areaCost + materials + labor + other;

      const quoteNumber =
        "Q-" + Math.floor(1000 + Math.random() * 9000);

      const date =
        new Date().toLocaleDateString();

      const quote =
        document.getElementById("quote");

      quote.style.display = "block";

      quote.innerHTML = `

        <div class="quote-header">

          <h2>CONSTRUCTION QUOTE</h2>

          <p><strong>${company}</strong></p>

          <div class="quote-contact">
            <p>📞 ${phone}</p>
            <p>✉️ ${email}</p>
          </div>

          <p>Quote #: ${quoteNumber}</p>

          <p>Date: ${date}</p>

        </div>

        <p>
          <strong>Client:</strong> ${client}
        </p>

        <p>
          <strong>Project:</strong> ${project}
        </p>

        <p>
          <strong>Type:</strong> ${type}
        </p>

        <p>
          <strong>Area:</strong> ${area} m²
        </p>

        <h3>Cost Breakdown</h3>

        <div class="quote-row">
          <span>Construction (${area} m² × €${price})</span>
          <span>€${areaCost.toFixed(2)}</span>
        </div>

        <div class="quote-row">
          <span>Materials</span>
          <span>€${materials.toFixed(2)}</span>
        </div>

        <div class="quote-row">
          <span>Labor</span>
          <span>€${labor.toFixed(2)}</span>
        </div>

        <div class="quote-row">
          <span>Other Costs</span>
          <span>€${other.toFixed(2)}</span>
        </div>

        <div class="total">
          TOTAL: €${total.toFixed(2)}
        </div>

        <button
          class="print-button"
          onclick="window.print()">
          Print / Save as PDF
        </button>

      `;

      quote.scrollIntoView({
        behavior: "smooth"
      });
    }

  </script>

</body>
</html>
