<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Quote Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      border-radius: 12px;
      border: none;
      resize: none;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6366f1;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4f46e5;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: rgba(0,0,0,0.25);
      border-radius: 15px;
      min-height: 80px;
      font-size: 20px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>✨ AI Quote Generator</h1>

    <p class="subtitle">
      Turn your idea into an inspiring quote.
    </p>

    <div class="card">

      <textarea id="idea" placeholder="Write an idea... e.g. Never give up"></textarea>

      <button onclick="generateQuote()">
        Generate Quote
      </button>

      <div id="result">
        Your quote will appear here...
      </div>

    </div>

    <div class="footer">
      AI Quote Generator © 2026
    </div>

  </div>

  <script>
    function generateQuote() {

      const idea = document.getElementById("idea").value.trim();
      const result = document.getElementById("result");

      if (!idea) {
        result.innerText = "Please write an idea first.";
        return;
      }

      const quotes = [
        `"${idea} — every great journey begins with one small step."`,
        `"Believe in ${idea}, keep moving forward, and never give up."`,
        `"Your idea today can become your success tomorrow: ${idea}."`,
        `"Stay focused on ${idea}. Progress takes patience, but it is worth it."`,
        `"Great things happen when you turn ${idea} into action."`
      ];

      const randomQuote =
        quotes[Math.floor(Math.random() * quotes.length)];

      result.innerText = randomQuote;
    }
  </script>

</body>
</html>
