<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Quote Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #4f46e5);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 35px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
      color: #111827;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    #quote {
      font-size: 22px;
      line-height: 1.5;
      color: #374151;
      margin: 30px 10px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate {
      background: #4f46e5;
      color: white;
    }

    .copy {
      background: #e5e7eb;
      color: #111827;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>✨ AI Quote Generator</h1>

    <p class="subtitle">
      Get a fresh dose of motivation.
    </p>

    <div id="quote">
      Click the button to generate a quote.
    </div>

    <button class="generate" onclick="generateQuote()">
      🔄 New Quote
    </button>

    <button class="copy" onclick="copyQuote()">
      📋 Copy
    </button>
  </div>
